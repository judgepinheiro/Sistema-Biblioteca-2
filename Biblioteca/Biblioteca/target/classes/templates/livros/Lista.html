
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros - Sistema de Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <header>
        <h1 th:text="${titulo}">Sistema de Biblioteca</h1>
        <p th:text="${mensagem}">Livros</p>
    </header>

    <nav>
        <a th:href="@{/livros}">Livros</a>
        <a th:href="@{/autores}">Autores</a>
        <a href="#">Categorias</a>
        <a href="#">Usuários</a>
        <a href="#">Empréstimos</a>
    </nav>

    <main class="container">

        <h2>Livros cadastrados</h2>

        <a th:href="@{/livros/novo}" class="botao">
            Novo Livro
        </a>

        <br><br>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>ISBN</th>
                    <th>Ano de publicação</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="livro : ${livros}">
                    <td th:text="${livro.id}"></td>
                    <td th:text="${livro.titulo}"></td>
                    <td th:text="${livro.autor}"></td>
                    <td th:text="${livro.isbn}"></td>
                    <td th:text="${livro.anoPublicacao}"></td>
                    <td>
                        <form th:action="@{/livros/excluir/{id}(id=${livro.id})}"
                              method="post">
                            <button type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(livros)}">
                    <td colspan="6">Nenhum livro cadastrado.</td>
                </tr>
            </tbody>
        </table>

    </main>

</body>
</html>
